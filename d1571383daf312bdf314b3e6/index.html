<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Розклад - КВП</title>
<style>
  :root { --bg: #f4f6f8; --card: #fff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb; --accent: #1d4ed8; --changed: #c2410c; --changedbg: #fff7ed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --line: #374151; --accent: #60a5fa; --changed: #fb923c; --changedbg: #431407; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: #1d4ed8; color: #fff; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 18px; }
  header small { opacity: .85; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; }
  .tabs { display: flex; gap: 6px; margin: 8px 0; }
  .tabs button { flex: 1; padding: 10px 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; font-size: 15px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #semPick { margin-bottom: 4px; font-weight: 600; }
  select { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  h2 { font-size: 15px; margin: 18px 0 6px; color: var(--muted); text-transform: capitalize; }
  .lesson { background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; border-left: 4px solid var(--accent); }
  .lesson.changed { border-left-color: var(--changed); background: var(--changedbg); }
  .time { font-weight: 600; }
  .time span { color: var(--muted); font-weight: normal; font-size: 14px; }
  .label { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .title, .meta { color: var(--muted); font-size: 14px; }
  .badge { color: var(--changed); font-size: 13px; font-weight: 600; }
  .empty { color: var(--muted); padding: 16px 0; }
  .chg { background: var(--card); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; }
  .chg b { color: var(--changed); }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; }
</style>
</head>
<body data-students="">
<header><h1 id="sem">Розклад занять</h1><small id="upd"></small></header>
<main>
  <select id="semPick" hidden></select>
  <div class="tabs" id="who">
    <button data-v="platoon">Мій взвод</button><button data-v="teacher">Я викладач</button>
  </div>
  <select id="pick"></select>
  <div class="tabs" id="period">
    <button data-v="today">Сьогодні</button><button data-v="week">Цей тиждень</button><button data-v="all">Увесь семестр</button>
  </div>
  <div id="list"></div>
  <h2>Зміни до розкладу</h2>
  <div id="changes"></div>
  <footer>Кафедра військової підготовки ЖВІ імені С. П. Корольова. Лише для перегляду.<br>Розклад КВП - розробник Приймачук О. В.</footer>
</main>
<script>
const DAYS = ['неділя', 'понеділок', 'вівторок', 'середа', 'четвер', 'пʼятниця', 'субота'];
const store = {
  get(k) { try { return localStorage.getItem(k) } catch (e) { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch (e) { /* без збереження */ } },
};
const st = { who: store.get('who') || 'platoon', id: store.get('id'), period: store.get('period') || 'week', sem: store.get('sem') };
let D = null, ALL = [];
if (document.body.dataset.students === '1') { st.who = 'platoon'; document.getElementById('who').style.display = 'none'; }  // сторінка для студентів
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const ddmm = (s) => s.slice(8, 10) + '.' + s.slice(5, 7);

function render() {
  for (const b of document.querySelectorAll('#who button')) b.classList.toggle('on', b.dataset.v === st.who);
  for (const b of document.querySelectorAll('#period button')) b.classList.toggle('on', b.dataset.v === st.period);
  const items = st.who === 'platoon' ? D.platoons.map((p) => [p.id, `Взвод ${p.n}${p.s ? ' (' + p.s + ')' : ''}`])
    : D.teachers.map((t) => [t.id, t.n]);
  if (!items.some(([id]) => String(id) === String(st.id))) st.id = null;
  $('pick').innerHTML = `<option value="">- виберіть -</option>` +
    items.map(([id, n]) => `<option value="${id}"${String(id) === String(st.id) ? ' selected' : ''}>${esc(n)}</option>`).join('');
  if (!st.id) { $('list').innerHTML = `<p class="empty">Виберіть ${st.who === 'platoon' ? 'свій взвод' : 'себе у списку'}.</p>`; $('changes').innerHTML = ''; return; }

  const id = Number(st.id);
  const mine = (x) => (st.who === 'platoon' ? x.pl : x.te).includes(id);
  const today = new Date(); const t0 = iso(today);
  const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const inPeriod = (d) => st.period === 'all' || (st.period === 'today' ? d === t0 : d >= iso(mon) && d <= iso(sun));
  const ls = D.lessons.filter((x) => mine(x) && inPeriod(x.d)).sort((a, b) => (a.d + a.p).localeCompare(b.d + b.p));

  const pNum = Object.fromEntries(D.platoons.map((p) => [p.id, p]));
  const tName = Object.fromEntries(D.teachers.map((t) => [t.id, t.n]));
  const time = (x) => {
    const g = D.grids[pNum[x.pl[0]]?.g]; const a = g && g[x.p], b = g && g[x.p + x.n - 1];
    return a && b ? `${a[0]}-${b[1]}` : '';
  };
  let html = '', day = '';
  for (const x of ls) {
    if (x.d !== day) { day = x.d; html += `<h2>${DAYS[new Date(x.d + 'T00:00').getDay()]}, ${ddmm(x.d)}${x.d === t0 ? ' - сьогодні' : ''}</h2>`; }
    const who = st.who === 'platoon' ? x.te.map((t) => tName[t]).join(', ') : 'Взвод ' + x.pl.map((p) => pNum[p]?.n).join(', ');
    html += `<div class="lesson${x.ch ? ' changed' : ''}">
      <div class="time">${esc(time(x))} <span>${2 * x.p - 1}-${2 * (x.p + x.n - 1)} год</span>${x.ch ? ` <span class="badge">змінено ${ddmm(x.ch)}</span>` : ''}</div>
      <div class="label">${esc(x.l)}</div>${x.t ? `<div class="title">${esc(x.t)}</div>` : ''}
      <div class="meta">${esc(who)}${x.r ? ' · ауд. ' + esc(x.r) : ''}</div></div>`;
  }
  if (!ls.length) {
    const next = D.lessons.filter((x) => mine(x) && x.d > t0).sort((a, b) => a.d.localeCompare(b.d))[0];
    html = `<p class="empty">${st.period === 'today' ? 'Сьогодні занять немає.' : 'Занять немає.'}${next ? ` Найближче - ${DAYS[new Date(next.d + 'T00:00').getDay()]}, ${ddmm(next.d)}.` : ''}</p>`;
  }
  $('list').innerHTML = html;

  const key = st.who === 'platoon' ? pNum[id]?.n : tName[id];
  const rel = D.changes.filter((c) => st.who === 'platoon' ? c.row[1].split(', ').includes(key) : (c.row[3] + c.row[4]).includes(key));
  $('changes').innerHTML = rel.length ? rel.slice(0, 50).map((c) => `<div class="chg">${ddmm(c.row[0])}, ${esc(c.row[2])} год, взвод ${esc(c.row[1])}<br>
    було: ${esc(c.row[3])}<br><b>стало: ${esc(c.row[4])}</b>${c.row[5] ? '<br>причина: ' + esc(c.row[5]) : ''}</div>`).join('')
    : '<p class="empty">Змін немає.</p>';
}

document.getElementById('who').onclick = (e) => { if (e.target.dataset.v) { st.who = e.target.dataset.v; st.id = null; store.set('who', st.who); render(); } };
document.getElementById('period').onclick = (e) => { if (e.target.dataset.v) { st.period = e.target.dataset.v; store.set('period', st.period); render(); } };
$('pick').onchange = (e) => { st.id = e.target.value; store.set('id', st.id); render(); };
$('semPick').onchange = (e) => { st.sem = e.target.value; store.set('sem', st.sem); useSem(); };

function useSem() {
  // запамʼятований семестр, інакше той, що йде сьогодні, інакше найближчий за датою
  const t0 = iso(new Date());
  D = ALL.find((s) => String(s.semester.id) === String(st.sem)) || ALL.find((s) => s.semester.start <= t0 && t0 <= s.semester.end)
    || ALL.filter((s) => s.semester.start > t0)[0] || ALL.at(-1);
  $('semPick').innerHTML = ALL.map((s) => `<option value="${s.semester.id}"${s === D ? ' selected' : ''}>${esc(s.semester.name)}</option>`).join('');
  $('semPick').hidden = ALL.length < 2;
  $('sem').textContent = 'Розклад занять - ' + D.semester.name;
  render();
}

fetch('data.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
  ALL = d.semesters || [d];
  $('upd').textContent = d.updated ? 'Оновлено ' + d.updated.slice(8, 10) + '.' + d.updated.slice(5, 7) + '.' + d.updated.slice(0, 4) + ' ' + d.updated.slice(11, 16) : '';
  useSem();
}).catch(() => { $('list').innerHTML = '<p class="empty">Не вдалося завантажити розклад. Перевірте інтернет і оновіть сторінку.</p>'; });
</script>
</body>
</html>
